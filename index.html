<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Aplica o tema salvo (localStorage) antes do primeiro paint, pra não
      // piscar o tema errado no carregamento. Ver src/lib/tema.ts.
      (function () {
        try {
          var tema = localStorage.getItem("tema");
          if (tema === "claro") document.documentElement.classList.add("light");
          else if (tema === "escuro") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calculadoras financeiras para planejar decisões de longo prazo: independência financeira e outros simuladores."
    />
    <link rel="canonical" href="https://patamar.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Patamar" />
    <meta property="og:title" content="Patamar" />
    <meta
      property="og:description"
      content="Calculadoras financeiras para planejar decisões de longo prazo: independência financeira e outros simuladores."
    />
    <meta property="og:url" content="https://patamar.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Patamar" />
    <meta
      name="twitter:description"
      content="Calculadoras financeiras para planejar decisões de longo prazo: independência financeira e outros simuladores."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>"
    />
    <title>Patamar</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
